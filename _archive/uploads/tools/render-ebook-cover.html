<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>cover render</title>
<style>html,body{margin:0;background:#fff}canvas{display:block;width:800px}</style>
</head><body>
<div id="stage">loading…</div>
<script type="module">
window.__ready = false;
(async () => {
  try {
    const pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
    const doc = await pdfjs.getDocument('../assets/ebooks/agentic-shopping-2026.pdf').promise;
    const page = await doc.getPage(1);
    const viewport = page.getViewport({ scale: 1600 / page.getViewport({scale:1}).width });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(viewport.width); canvas.height = Math.round(viewport.height);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    const stage = document.getElementById('stage');
    stage.textContent = '';
    stage.appendChild(canvas);
    await doc.destroy();
    window.__ready = true;
  } catch (e) { document.getElementById('stage').textContent = 'ERR: ' + e.message; }
})();
</script>
</body></html>
